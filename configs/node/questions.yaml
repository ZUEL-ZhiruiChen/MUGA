dataset:
  name: questions
  type: heterophily_npz
  data_dir: data/raw/node/questions
  file_name: questions.npz
  to_undirected: true
  max_nodes: 5000
  feature_projection_dim: 256
  train_per_class: 20
  val_size: 1000
  test_size: 1000
model:
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.35
  hop_k: 2
  structural_cap: 32
  knn_k: 12
  n_clusters: 64
  gate_temperature: 1.8
  gate_residual: 0.10
  enabled_views: [structural, feature_knn, prototype]
  view_gate_prior:
    structural: 0.34
    feature_knn: 0.33
    prototype: 0.33
  prototype_method: kmeans
  prototype_soft_topk: 3
loss:
  lambda_align: 0.15
  lambda_var: 0.05
  lambda_elastic: 0.20
  variance_gamma: 1.0
  elastic_margin: 0.10
  max_elastic_pairs: 12000
  neg_margin: 0.8
  distill_warmup_epochs: 20
  distill_temperature: 1.8
optim:
  lr: 0.003
  weight_decay: 0.0005
train:
  epochs: 120
  patience: 30
  grad_clip: 5.0
seed: 0
seeds: [0, 1, 2, 3, 4]
