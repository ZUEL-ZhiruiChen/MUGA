dataset:
  name: tolokers
  type: heterophily_npz
  metric: auroc
  data_dir: data/raw/node/tolokers
  file_name: tolokers.npz
model:
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.30
  hop_k: 2
  structural_cap: 32
  knn_k: 20
  n_clusters: 96
  gate_mode: reliability
  fusion_mode: logits
  gate_detach_inputs: true
  reliability_entropy_bias: 0.40
  gate_temperature: 0.8
  gate_residual: 0.00
  enabled_views: [feature_knn, prototype]
  view_gate_prior:
    feature_knn: 0.60
    prototype: 0.40
  prototype_method: kmeans
  prototype_soft_topk: 3
loss:
  lambda_view_ce: 0.00
  lambda_gate_supervision: 1.00
  gate_supervision_warmup: 20
  gate_supervision_temperature: 0.7
  lambda_gate_entropy: 0.01
  lambda_align: 0.15
  lambda_var: 0.05
  lambda_elastic: 0.20
  variance_gamma: 1.0
  elastic_margin: 0.10
  max_elastic_pairs: 16000
  neg_margin: 0.8
  distill_warmup_epochs: 1000
  distill_temperature: 1.8
optim:
  lr: 0.003
  weight_decay: 0.0005
train:
  selection: oracle
  expert_pretrain_epochs: 20
  freeze_experts_after_pretrain: true
  epochs: 100
  patience: 25
  grad_clip: 5.0
seed: 0
seeds: [0, 1, 2]

