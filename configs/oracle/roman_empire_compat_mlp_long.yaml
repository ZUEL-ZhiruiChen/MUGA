dataset:
  name: roman_empire
  type: heterophily_npz
  data_dir: data/raw/node/roman_empire
  file_name: roman_empire.npz
model:
  model_type: compat_mlp
  hidden_dim: 256
  num_layers: 4
  dropout: 0.35
  layer_norm: true
  lp_steps: 4
  lp_alpha: 0.20
  lp_direction: both
  lp_concat_steps: true
  lp_only: false
  compat_smoothing: 0.20
optim:
  lr: 0.001
  weight_decay: 0.0002
loss:
  label_smoothing: 0.05
train:
  epochs: 500
  patience: 120
  grad_clip: 5.0
  selection: oracle
seed: 1
seeds: [1]
