dataset:
  name: chameleon_filtered_directed
  type: heterophily_npz
  data_dir: data/raw/node/chameleon_filtered_directed
  file_name: chameleon_filtered_directed.npz
  to_undirected: false
model:
  model_type: risk_router
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.35
  hop_k: 2
  structural_cap: 32
  knn_k: 18
  n_clusters: 64
  enabled_views:
  - structural
  - feature_knn
  - prototype
  prototype_method: kmeans
  prototype_soft_topk: 3
  utility_shared_stem: true
  risk_feature_dim: 4
  path_logit_calibration: false
  raw_gcn_layers: 3
  raw_gcn_residual: true
  raw_gcn_norm: layer
  raw_gcn_self_loop: true
  raw_gcn_adj_norm: row
  view_gate_temperature: 0.9
  view_gate_topk: 0
  view_gate_sharpen_power: 1.0
  view_reliability_entropy_bias: 0.4
  view_gate_prior:
    structural: 0.1
    feature_knn: 0.6
    prototype: 0.3
  route_temperature: 0.8
  route_topk: 2
  route_sharpen_power: 1.5
  route_detach_inputs: true
  final_detach_mode: none
  path_fusion: mixture
  route_prior:
    view_risk: 0.34
    feature: 0.28
    structure: 0.38
loss:
  label_smoothing: 0.0
  pretrain_lambda_path_ce: 1.0
  pretrain_lambda_view_ce: 1.0
  lambda_final_ce: 1.0
  lambda_path_ce: 0.0
  lambda_view_ce: 0.2
  lambda_router_path_ce: 1.0
  router_path_ce_warmup: 30
  router_path_ce_detach_route: true
  router_path_ce_floor: 0.0
  lambda_route_supervision: 0.75
  lambda_route_balance: 0.3
  route_balance_warmup: 25
  route_balance_target:
  - 0.34
  - 0.28
  - 0.38
  route_balance_temperature: 1.0
  route_supervision_warmup: 30
  route_supervision_temperature: 0.7
  lambda_route_entropy: 0.0
  elastic_margin: 0.1
  max_elastic_pairs: 0
optim:
  lr: 0.002
  weight_decay: 0.0002
train:
  epochs: 220
  patience: 80
  grad_clip: 5.0
  selection: oracle
  expert_pretrain_epochs: 30
  pretrain_view_path_only: true
  restore_view_rng_after_init: true
  freeze_view_path_after_pretrain: true
  save_routing_diagnostics: true
seed: 3
seeds:
- 3
- 4
- 13
