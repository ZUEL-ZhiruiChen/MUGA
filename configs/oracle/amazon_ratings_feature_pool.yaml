dataset:
  name: amazon_ratings
  type: heterophily_npz
  data_dir: data/raw/node/amazon_ratings
  file_name: amazon_ratings.npz
model:
  hidden_dim: 256
  proj_dim: 128
  K: 1
  dropout: 0.35
  hop_k: 1
  structural_cap: 1
  knn_k: 5
  n_clusters: 16
  gate_mode: reliability
  fusion_mode: logits
  gate_detach_inputs: true
  reliability_entropy_bias: 0.20
  gate_temperature: 0.9
  gate_residual: 0.00
  enabled_views: [identity]
  direct_experts: [feature_mlp]
  view_gate_prior:
    identity: 0.20
    feature_mlp: 0.80
  prototype_method: kmeans
  prototype_soft_topk: 2
loss:
  label_smoothing: 0.05
  lambda_view_ce: 0.50
  lambda_gate_supervision: 0.50
  gate_supervision_warmup: 20
  gate_supervision_temperature: 0.7
  lambda_gate_entropy: 0.00
  lambda_align: 0.0
  lambda_var: 0.0
  lambda_elastic: 0.0
  variance_gamma: 1.0
  elastic_margin: 0.08
  max_elastic_pairs: 0
  neg_margin: 0.8
  distill_warmup_epochs: 1000
  distill_temperature: 1.8
optim:
  lr: 0.001
  weight_decay: 0.0002
train:
  epochs: 400
  patience: 100
  grad_clip: 5.0
  selection: oracle
  expert_pretrain_epochs: 0
  freeze_experts_after_pretrain: false
seed: 2
seeds: [2]
