dataset:
  name: tolokers
  type: heterophily_npz
  metric: auroc
  data_dir: data/raw/node/tolokers
  file_name: tolokers.npz
model:
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.30
  hop_k: 2
  structural_cap: 32
  knn_k: 20
  n_clusters: 96
  gate_mode: reliability
  fusion_mode: logits
  gate_detach_inputs: true
  reliability_entropy_bias: 0.35
  gate_temperature: 0.9
  gate_residual: 0.00
  enabled_views: [feature_knn, prototype]
  direct_experts: [feature_mlp, raw_gcn]
  raw_gcn_layers: 2
  raw_gcn_residual: true
  raw_gcn_norm: layer
  raw_gcn_self_loop: true
  raw_gcn_adj_norm: row
  view_gate_prior:
    feature_knn: 0.15
    prototype: 0.10
    feature_mlp: 0.65
    raw_gcn: 0.10
  prototype_method: kmeans
  prototype_soft_topk: 3
loss:
  label_smoothing: 0.02
  lambda_view_ce: 0.15
  lambda_gate_supervision: 0.75
  gate_supervision_warmup: 50
  gate_supervision_temperature: 0.7
  lambda_gate_entropy: 0.00
  lambda_align: 0.0
  lambda_var: 0.0
  lambda_elastic: 0.0
  variance_gamma: 1.0
  elastic_margin: 0.10
  max_elastic_pairs: 0
  neg_margin: 0.8
  distill_warmup_epochs: 1000
  distill_temperature: 1.8
optim:
  lr: 0.001
  weight_decay: 0.0002
train:
  epochs: 400
  patience: 100
  grad_clip: 5.0
  selection: oracle
  expert_pretrain_epochs: 50
  freeze_experts_after_pretrain: false
seed: 1
seeds: [1]
