dataset:
  name: squirrel_filtered
  type: heterophily_npz
  data_dir: data/raw/node/squirrel_filtered
  file_name: squirrel_filtered.npz
model:
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.35
  refine: false
  hop_k: 2
  structural_cap: 48
  knn_k: 20
  n_clusters: 64
  gate_mode: reliability
  fusion_mode: logits
  gate_detach_inputs: true
  reliability_entropy_bias: 0.40
  gate_temperature: 0.8
  gate_residual: 0.00
  gate_topk: 1
  gate_sharpen_power: 2.0
  regime_temperature: 0.5
  regime_topk: 1
  regime_sharpen_power: 2.0
  enabled_views: [structural, feature_knn, prototype]
  direct_experts: [feature_mlp, raw_gcn]
  raw_gcn_layers: 2
  raw_gcn_residual: true
  raw_gcn_norm: layer
  raw_gcn_self_loop: true
  raw_gcn_adj_norm: row
  regime_groups:
    view_risk: [structural, feature_knn, prototype]
    feature: [feature_mlp]
    structure: [raw_gcn]
  regime_prior:
    view_risk: 0.85
    feature: 0.05
    structure: 0.10
  view_gate_prior:
    structural: 0.10
    feature_knn: 0.30
    prototype: 0.20
    feature_mlp: 0.30
    raw_gcn: 0.10
  prototype_method: kmeans
  prototype_soft_topk: 3
loss:
  label_smoothing: 0.00
  lambda_view_ce: 0.10
  lambda_gate_supervision: 1.00
  gate_supervision_warmup: 25
  gate_supervision_temperature: 0.7
  lambda_gate_entropy: 0.01
  lambda_align: 0.0
  lambda_var: 0.0
  lambda_elastic: 0.0
  variance_gamma: 1.0
  elastic_margin: 0.10
  max_elastic_pairs: 0
  neg_margin: 0.8
  distill_warmup_epochs: 1000
  distill_temperature: 1.8
optim:
  lr: 0.003
  weight_decay: 0.0002
train:
  epochs: 220
  patience: 80
  grad_clip: 5.0
  selection: oracle
  expert_pretrain_epochs: 25
  freeze_experts_after_pretrain: true
seed: 2
seeds: [2]

