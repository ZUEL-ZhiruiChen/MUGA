dataset:
  name: reed98
  type: linkx_mat
  data_dir: data/raw/node/reed98
  file_name: data.mat
  train_per_class: 50
  val_size: 150
  test_size: 200
model:
  hidden_dim: 128
  proj_dim: 64
  K: 2
  dropout: 0.3
  hop_k: 2
  structural_cap: 48
  knn_k: 16
  n_clusters: 128
  gate_temperature: 1.8
  gate_residual: 0.1
  enabled_views:
  - structural
  - feature_knn
  - prototype
  view_gate_prior:
    structural: 0.25
    feature_knn: 0.45
    prototype: 0.3
  prototype_method: kmeans
  prototype_soft_topk: 3
  model_type: risk_router
  utility_shared_stem: true
  risk_feature_dim: 4
  path_logit_calibration: false
  raw_gcn_layers: 3
  raw_gcn_residual: true
  raw_gcn_norm: layer
  raw_gcn_self_loop: true
  raw_gcn_adj_norm: row
  view_gate_temperature: 1.8
  view_gate_residual: 0.1
  view_gate_mode: reliability
  view_fusion_mode: logits
  view_gate_detach_inputs: true
  view_gate_topk: 0
  view_gate_sharpen_power: 1.0
  view_reliability_entropy_bias: 0.0
  route_temperature: 0.8
  route_topk: 2
  route_sharpen_power: 1.2
  route_detach_inputs: true
  final_detach_mode: none
  path_fusion: mixture
  route_prior:
    view_risk: 0.2
    feature: 0.2
    structure: 0.6
loss:
  label_smoothing: 0.0
  pretrain_lambda_path_ce: 1.0
  pretrain_lambda_view_ce: 1.0
  lambda_final_ce: 1.0
  lambda_path_ce: 0.15
  lambda_view_ce: 0.0
  lambda_router_path_ce: 0.5
  router_path_ce_warmup: 15
  router_path_ce_detach_route: true
  router_path_ce_floor: 0.05
  lambda_route_supervision: 0.5
  route_supervision_warmup: 15
  route_supervision_temperature: 0.7
  lambda_route_balance: 0.0
  lambda_route_entropy: 0.0
  elastic_margin: 0.1
  max_elastic_pairs: 0
optim:
  lr: 0.003
  weight_decay: 0.0005
train:
  epochs: 100
  patience: 25
  grad_clip: 5.0
  selection: oracle
  expert_pretrain_epochs: 0
  pretrain_view_path_only: false
  save_routing_diagnostics: true
seed: 0
seeds:
- 0
- 1
- 2
